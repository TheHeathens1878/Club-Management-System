# Supabase CLI config. Linked to aomsc-function-room (rwpglslbkhsqyxjhnpue) in P0.2.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "club-management-system"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"

# ---------------------------------------------------------------------------
# Edge Functions. See supabase/functions/README.md for triggers and secrets.
#
# `verify_jwt = false` is only for the two callers that cannot present a
# Supabase JWT and authenticate another way:
#   * stripe-webhook — Stripe's `stripe-signature` header over the raw body;
#   * push-fanout    — a Database Webhook's `x-webhook-secret` header.
# Everything else is `verify_jwt = true`; the scheduled jobs additionally
# require the service-role key, and the two user-facing functions do their real
# authorisation with a user-scoped client.
# ---------------------------------------------------------------------------

[functions.fulltime-import]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

[functions.stripe-checkout]
verify_jwt = true

[functions.arrears-reminders]
verify_jwt = true

[functions.safeguarding-nudges]
verify_jwt = true

[functions.comms-dispatch]
verify_jwt = true

[functions.media-quarantine]
verify_jwt = true

[functions.media-signed-url]
verify_jwt = true

[functions.push-fanout]
verify_jwt = false
